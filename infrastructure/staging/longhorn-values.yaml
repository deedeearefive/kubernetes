apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      version: ">=1.10.0"
  test:
    enable: false
  values:
    ingress:
      main:
        hosts:
          - host: longhorn.home.local
            paths:
              - path: /
                pathType: Prefix


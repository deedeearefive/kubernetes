---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      version: ">=1.10.0"
  test:
    enable: false
  values:
    # Optional: ensure only workers are used for storage
    longhornManager:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      createDefaultDiskLabeledNodes: true
    global:
      nodeSelector:
        storage: "longhorn"
    ingress:
      enabled: true
      host: lh.home.local
      paths:
      path: /
      pathType: Prefix

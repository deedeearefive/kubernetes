---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      version: ">=1.10.0"
  test:
    enable: false
  values:
    global:
      nodeSelector:
        storage: "longhorn"
    ingress:
      enabled: true
      host: longhorn.staging.home.local
      paths:
      path: /
      pathType: Prefix

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      version: ">=1.10.0"
  test:
    enable: false
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      createDefaultDiskLabeledNodes: true
      storageReservedPercentageForDefaultDisk: "0"
    global:
      nodeSelector:
        storage: "longhorn"
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus
    ingress:
      enabled: true
      host: longhorn.home.local
      paths:
      path: /
      pathType: Prefix
      annotations:
        lbipam.cilium.io/ips: "172.198.1.10"

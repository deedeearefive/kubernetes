---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  chart:
    spec:
      version: ">=79.4.0"
  values:
    grafana:
      ingress:
        enabled: true
        hosts:
          - host: grafana.home.local
            paths:
            - path: "/"

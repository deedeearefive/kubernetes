---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  chart:
    spec:
      version: ">=79.4.1"
  values:
    grafana:
      admin:
        existingSecret: "prometheus-grafana-admin-user"
        userKey: user
        passwordKey: password
      ingress:
        enabled: true
        hosts:
          - grafana.home.local
        path: /

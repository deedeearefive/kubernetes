---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  chart:
    spec:
      version: ">=0.10.1"
  values:
    controllers:
      main:
        containers:
          main:
            env:
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}' 
              DB_HOSTNAME: "immich-postgres-rw.immich.svc.cluster.local"
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: DB_USERNAME
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: DB_DATABASE_NAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: DB_PASSWORD
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-photos
    server:
      ingress:
        main:
          enabled: true
          annotations:
            lbipam.cilium.io/ips: "172.198.1.11"
          hosts:
            - host: immich.home.local
              paths:
              - path: "/"
                service:
                  identifier: main
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          size: 1Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
    persistence:
      cache:
        enabled: true
        size: 10Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteMany

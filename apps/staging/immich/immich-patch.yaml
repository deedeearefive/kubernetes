---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-release
  namespace: immich
spec:
  chart:
    spec:
      version: ">=0.10.1"
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-photos
    ingress:
      enabled: true
      host: immich.home.local
      paths:
      path: /
      pathType: Prefix
    valkey:
      persistence:
        data:
          enabled: true
          size: 1Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
    persistence:
      cache:
        enabled: true
        size: 10Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteMany

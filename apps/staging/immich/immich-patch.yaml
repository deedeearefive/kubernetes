---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-release
  namespace: immich
spec:
  chart:
    spec:
      version: ">=0.10.1"
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: "immich-postgres-rw.immich.svc.cluster.local"
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: DB_USERNAME
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: DB_DATABASE_NAME
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-user
                    key: DB_PASSWORD
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
    immich:
      persistence:
        library:
          existingClaim: immich-photos
    ingress:
      enabled: true
      host: immich.home.local
      paths:
      path: /
      pathType: Prefix
    valkey:
      persistence:
        data:
          enabled: true
          size: 1Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
    persistence:
      cache:
        enabled: true
        size: 10Gi
        type: persistentVolumeClaim
        accessMode: ReadWriteMany

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbs-release
  namespace: openebs
spec:
  chart:
    spec:
      version: ">=1.6.0"
  test:
    enable: false
  values:
    mayastor:
      csi:
        node:
          # We need to disable the init container that checks for the nvme_tcp module, since Talos has that module built-in.
          initConainers:
            enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false

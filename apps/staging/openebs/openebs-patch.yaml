apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  chart:
    spec:
      version: ">=4.3.3"
  test:
    enable: false
  values:
    mayastor:
    csi:
      node:
        initContainers:
          enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false

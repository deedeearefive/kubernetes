apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium-dnsserver
  namespace: technitium-dnsserver
spec:
  chart:
    spec:
      version: ">=1.0.0-alpha"
  test:
    enable: false
  values:
    ingress:
      main:
        hosts:
          - host: technitium-dnsserver.staging.home.local
            paths:
              - path: /
                pathType: Prefix


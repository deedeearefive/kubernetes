apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  chart:
    spec:
      version: ">=1.4.3"
  test:
    enable: false
  values:
    service:
      type: LoadBalancer
      port: 80
      portName: http
      targetPort: 8080
      annotations: {}
      labels: {}
    ingress:
      main:
        hosts:
          - host: gatus.staging.home.local
            paths:
              - path: /
                pathType: Prefix
    config:
      endpoints:
        - name: Technitium
          url: technitium.staging.home.local:53
          interval: 60s
          conditions:
            - "[STATUS] == 200"

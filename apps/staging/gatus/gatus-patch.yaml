apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  chart:
    spec:
      version: ">=1.4.3"
  test:
    enable: false
  values:
    ingress:
      main:
        hosts:
          - host: gatus.staging.home.local
            paths:
              - path: /
                pathType: Prefix


apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  releaseName: gatus
  chart:
    spec:
      chart: gatus
      sourceRef:
        kind: HelmRepository
        name: twin
  interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  # Default values
  values:
    ingress:
      main:
        enabled: true

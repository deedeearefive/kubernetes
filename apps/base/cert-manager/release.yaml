apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-release
  namespace: cert-manager
spec:
  releaseName: cert-manager-release
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository

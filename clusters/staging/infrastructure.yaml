---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
 name: longhorn
 namespace: longhorn-system
spec:
 interval: 1h
 retryInterval: 1m
 timeout: 5m
 sourceRef:
   kind: GitRepository
   name: flux-system
 path: ./infrastructure/longhorn
 prune: true
 wait: true
